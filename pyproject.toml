# EX04 — Graphify + Obsidian Reverse-Engineering Agent
# Authors (real student identities — never "AI Agent"):
#   Eyal Shtinmtez   — ID 314884834 — אייל שטינמץ
#   Imree Cohen      — ID 312359284 — אמרי כהן  (email TBD)
# uv-only project (D7 / R9.1). Provider/model are config-driven (config/agent.json), NOT
# hardcoded and NOT pinned to a default here (D6).
[project]
name = "ex04-graphify-agent"
version = "0.1.0"
description = "Graph-guided LangGraph agent that reverse-engineers and fixes a bug in martinpeck/broken-python via Graphify + Obsidian, proving token savings vs a naive baseline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Eyal Shtinmtez", email = "eyalshtinmetz@gmail.com" },
    { name = "Imree Cohen", email = "imree.c@gmail.com" },
]
dependencies = [
    "networkx>=3.2",
    "langgraph>=0.2",
    "google-genai>=0.3",
    "typer>=0.12",
    "python-dotenv>=1.2.2",
]

[project.scripts]
ex04 = "ex04_graphify_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "matplotlib>=3.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ex04_graphify_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
# Vendored target code, generated artifacts, the Obsidian vault and course PDFs are NOT
# our source — never lint them (they contain intentionally-broken Python).
extend-exclude = [
    "data",
    "broken-python",
    "artifacts",
    "obsidian",
    "lec",
    "reports",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is reported on every run; the >=90% gate is enforced explicitly in CI / pre-commit
# (`--cov-fail-under=90`) so that running a subset of tests locally does not spuriously fail.
addopts = "--cov=src --cov-report=term-missing"
markers = [
    "eval: keyless structural/known-answer evals (pass^k=100%); run via -m eval",
    "behavioural: real-LLM opt-in evals (need a provider key); excluded from CI",
]

[tool.coverage.report]
show_missing = true
