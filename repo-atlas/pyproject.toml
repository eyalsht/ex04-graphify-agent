# repo-atlas — graph-guided repository comprehension.
# Forked from ex04-graphify-agent (University of Haifa, EX04). Authors carried over from the
# origin project; adjust before any public release.
# uv-only project. Provider/model are config-driven (config/atlas.json), never hardcoded here.
[project]
name = "repo-atlas"
version = "0.1.0"
description = "Turn any Python repo into a knowledge graph, an Obsidian vault and an LLM-written architecture brief, at a fraction of the tokens a full-source dump costs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Eyal Shtinmtez", email = "eyalshtinmetz@gmail.com" },
    { name = "Imree Cohen", email = "imree.c@gmail.com" },
]
dependencies = [
    # 3.4 is the floor for nx.node_link_graph(..., edges="links"); the origin project
    # floored at 3.2 and only worked by lockfile luck.
    "networkx>=3.4",
    "langgraph>=0.2",
    "typer>=0.12",
    "python-dotenv>=1.2.2",
]

# The provider SDK is optional: the whole tool runs keyless against the mock client.
[project.optional-dependencies]
gemini = ["google-genai>=0.3"]

[project.scripts]
atlas = "repo_atlas.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_atlas"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
# Golden fixtures are third-party source vendored for regression testing — never lint them.
extend-exclude = ["tests/fixtures/golden"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is reported on every run; the >=90% gate is enforced explicitly in CI / pre-commit
# (`--cov-fail-under=90`) so that running a subset of tests locally does not spuriously fail.
addopts = "--cov=src --cov-report=term-missing"
markers = [
    "eval: keyless structural/known-answer evals (pass^k=100%); run via -m eval",
    "behavioural: real-LLM opt-in evals (need a provider key); excluded from CI",
]

[tool.coverage.report]
show_missing = true
