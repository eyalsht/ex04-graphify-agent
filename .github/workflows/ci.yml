name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync (keyless — no provider API key is set in CI)
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict, src/)
        run: uv run mypy --strict src/

      - name: File-size gate (<=150 lines)
        run: uv run python scripts/check_file_sizes.py

      - name: No-hardcoded gate
        run: uv run python scripts/check_no_hardcoded.py

      - name: Anti-pattern gate
        run: uv run python scripts/check_anti_patterns.py

      - name: Tests + coverage (keyless, >=90%)
        run: uv run pytest --cov=src --cov-fail-under=90

      - name: Structural evals (keyless, pass^k)
        run: uv run pytest -m eval --no-cov
